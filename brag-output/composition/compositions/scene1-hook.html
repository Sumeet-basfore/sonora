<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sonora - The Hook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090a0f;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #090a0f;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        pointer-events: none;
      }
      .ambient-glow-indigo {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
      }
      .ambient-glow-amber {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(245, 158, 11, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
      }
      .pill-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid rgba(129, 140, 248, 0.5);
        background: rgba(99, 102, 241, 0.15);
        color: #a5b4fc;
      }
      .gradient-title {
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-accent-amber {
        background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .spectrum-container {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 90px;
      }
      .spectrum-bar {
        width: 8px;
        background: linear-gradient(to top, #6366f1 0%, #38bdf8 60%, #f59e0b 100%);
        border-radius: 4px 4px 0 0;
        min-height: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene1-hook" data-width="1920" data-height="1080">
      <div class="bg-grid"></div>
      <div class="ambient-glow-indigo" data-layout-allow-overflow style="top: -100px; left: 510px;"></div>
      <div class="ambient-glow-amber" data-layout-allow-overflow style="bottom: -150px; right: 400px;"></div>

      <div style="text-align: center; max-width: 1400px; z-index: 10;">
        <div id="s1-badge" class="pill-badge" style="margin-bottom: 28px; opacity: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
          SONORA v0.2 • AUDIOPHILE SOUND ARCHITECTURE
        </div>

        <h1 id="s1-h1" style="font-size: 82px; font-weight: 800; line-height: 1.08; letter-spacing: -0.04em; margin-bottom: 20px; opacity: 0;" class="gradient-title">
          YOUR MUSIC ISN'T A STREAM.
        </h1>

        <h2 id="s1-h2" style="font-size: 56px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 48px; opacity: 0;" class="gradient-accent-amber">
          It's an instrument.
        </h2>

        <div id="s1-spectrum" class="spectrum-container" style="justify-content: center; opacity: 0;">
          <div class="spectrum-bar s1-bar" style="height: 25px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 42px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 68px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 85px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 74px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 55px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 79px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 90px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 65px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 82px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 88px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 70px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 52px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 78px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 85px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 60px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 72px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 89px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 80px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 64px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 50px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 75px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 86px;"></div>
          <div class="spectrum-bar s1-bar" style="height: 58px;"></div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s1-badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#s1-h1", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.4);
      tl.fromTo("#s1-h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.8);
      tl.fromTo("#s1-spectrum", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);

      const s1Bars = document.querySelectorAll(".s1-bar");
      s1Bars.forEach((bar, i) => {
        const targetScale = 0.3 + (Math.sin(i * 0.4) + 1) * 0.5;
        tl.to(bar, { scaleY: targetScale, transformOrigin: "bottom", duration: 0.4, repeat: 3, yoyo: true, ease: "sine.inOut" }, 1.3 + (i % 4) * 0.08);
      });

      tl.to("#root", { opacity: 0, scale: 1.05, duration: 0.4, ease: "power2.in" }, 3.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene1-hook"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
