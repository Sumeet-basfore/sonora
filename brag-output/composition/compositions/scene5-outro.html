<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sonora - Outro & CTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090a0f;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #090a0f;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        pointer-events: none;
      }
      .ambient-glow-indigo {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
      }
      .ambient-glow-amber {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(245, 158, 11, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
      }
      .glass-card {
        background: rgba(18, 20, 29, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
        border-radius: 16px;
      }
      .gradient-title {
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-accent-indigo {
        background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #4338ca 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene5-outro" data-width="1920" data-height="1080">
      <div class="bg-grid"></div>
      <div class="ambient-glow-indigo" data-layout-allow-overflow style="top: -100px; left: 510px;"></div>
      <div class="ambient-glow-amber" data-layout-allow-overflow style="bottom: -150px; right: 400px;"></div>

      <div style="text-align: center; max-width: 1200px; z-index: 10;">
        <div id="s5-logo" style="width: 90px; height: 90px; margin: 0 auto 30px; border-radius: 22px; background: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #f59e0b 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(99, 102, 241, 0.6); opacity: 0;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="white">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>

        <h1 id="s5-title" style="font-size: 76px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 16px; opacity: 0;" class="gradient-title">
          SONORA v0.2
        </h1>

        <p id="s5-subtitle" style="font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 36px; opacity: 0;" class="gradient-accent-indigo">
          Local-First. Bit-Perfect. Open Source.
        </p>

        <div id="s5-cta" class="glass-card" style="display: inline-flex; align-items: center; gap: 16px; padding: 16px 36px; border-radius: 9999px; opacity: 0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color: #f8fafc;">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span class="mono" style="font-size: 20px; font-weight: 600; color: #f8fafc;">github.com/Sumeet-basfore/sonora</span>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s5-logo", 
        { opacity: 0, scale: 0.4, rotation: -30 }, 
        { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.7)" }, 
        0.2
      );
      tl.fromTo("#s5-title", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.5);
      tl.fromTo("#s5-subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.8);
      tl.fromTo("#s5-cta", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.3)" }, 1.1);

      tl.to("#s5-logo", { scale: 1.08, duration: 1.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene5-outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
