name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ALSA & WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build TypeScript frontend
        run: |
          npm --prefix apps/desktop install
          npm --prefix apps/desktop run build

      - name: Frontend tests
        run: npm --prefix apps/desktop test

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build first-party plugin artifacts
        run: |
          ./plugins/spectrum-plus/build.sh
          ./plugins/lyrics-genius/build.sh

      - name: Rebuild deterministic registry
        run: |
          python3 community-registry/tools/build.py
          git diff --exit-code -- community-registry/v1 community-registry/packages || (echo "registry artifacts not reproducible; rerun tools/build.py and commit" && exit 1)

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets

      - name: Cargo test workspace
        run: cargo test --workspace --verbose
